name: Daily Morning Brief

on:
  schedule:
    # Daily at 22:00 UTC (06:00 AM Manila / 03:30 AM IST)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mock_tts:
        description: 'Use mock TTS synthesis instead of external API'
        type: boolean
        required: false
        default: true
      publish_to_storage:
        description: 'Publish episode audio and RSS feed to remote storage'
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  briefing-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ------------------------------------------------------------------------
      # Stage 1: Ingestion
      # ------------------------------------------------------------------------
      - name: Ingest news sources
        run: |
          echo "Ingesting configured sources from config/sources.yaml..."
          python -m src.main --stage ingest

      # ------------------------------------------------------------------------
      # Stage 2: Ranking & Deduplication
      # ------------------------------------------------------------------------
      - name: Rank and shortlist candidate stories
        run: |
          echo "Scoring, deduplicating, and building section shortlist..."
          python -m src.main --stage rank

      # ------------------------------------------------------------------------
      # Stage 3: Script Generation
      # ------------------------------------------------------------------------
      - name: Generate briefing script
        env:
          # TODO: Provide LLM credentials when connecting production model provider
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRIPT_GEN_MOCK: 'true'
        run: |
          echo "Drafting spoken script conforming to 420-480 second timing budget..."
          python -m src.main --stage script

      # ------------------------------------------------------------------------
      # Stage 4: Text-to-Speech (TTS) Narration
      # ------------------------------------------------------------------------
      - name: Synthesize audio narration
        env:
          # TODO: Provide TTS credentials for production voice synthesis
          # ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOCK_TTS: ${{ github.event.inputs.mock_tts || 'true' }}
        run: |
          echo "Rendering narration audio into MP3 podcast format..."
          python -m src.main --stage tts

      # ------------------------------------------------------------------------
      # Stage 5: Podcast Feed & Storage Publishing
      # ------------------------------------------------------------------------
      - name: Publish episode and update podcast RSS feed
        env:
          # TODO: Provide object storage / CDN credentials for private feed hosting
          # AWS_ACCESS_KEY_ID: ${{ secrets.PODCAST_STORAGE_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.PODCAST_STORAGE_SECRET }}
          # S3_BUCKET_NAME: ${{ secrets.PODCAST_BUCKET_NAME }}
          # PODCAST_FEED_URL: ${{ secrets.PODCAST_PRIVATE_FEED_URL }}
          # CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          PUBLISH_TO_STORAGE: ${{ github.event.inputs.publish_to_storage || 'false' }}
        run: |
          echo "Packaging audio enclosure, updating podcast.xml, and writing run report..."
          python -m src.main --stage publish

      # ------------------------------------------------------------------------
      # Run Artifacts
      # ------------------------------------------------------------------------
      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-artifacts-${{ github.run_id }}
          path: |
            data/
          retention-days: 14
